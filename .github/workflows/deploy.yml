name: deploy

# 推送到 main 即自动部署到生产服务器;也可在 Actions 页手动触发。
# 需要在仓库 Secrets 中配置: DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY
# (值由服务器上 deploy/bootstrap.sh 的运行输出给出)
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时刻只允许一个部署运行:连续 push 时后到的排队,
# 避免两个 run 并发 git pull / compose build 互相踩踏。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: 未配置 secrets 时跳过
        env:
          H: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$H" ]; then
            echo "DEPLOY_* secrets 未配置,跳过部署(先在仓库 Settings → Secrets 配置)"
            exit 0
          fi

      - name: SSH 部署
        uses: appleboy/ssh-action@v1.2.0
        if: ${{ env.DEPLOY_HOST != '' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # ECS 带宽小,全量装依赖可能 >10min(ssh-action 默认超时),放宽到 60min。
          # 有 BuildKit 缓存挂载后,日常代码变更的重建远达不到这个值;
          # 但缓存被磁盘压力回收后的冷构建(backend pip ~10min + 前端 npm + 导出)
          # 会压线,30min 不够。
          timeout: 60m
          script: |
            set -e
            cd /opt/hronfire
            # fetch + reset 而非 pull:force-push/历史改写时 pull --ff-only 直接失败;
            # 服务器是纯部署检出(无本地改动,生成物均未被跟踪),reset 到远端永远正确且自愈
            git fetch --depth=50 origin
            git reset --hard origin/main
            # 基线 = 上次【部署成功】的提交(写进 .last-deployed),不是 pull 前的
            # HEAD —— 否则上次 pull 成功但 build 超时/失败时,重跑会误判"无改动"
            # 而永远不重建。基线缺失或不可回溯 → 保守全量重建。
            BASE=$(cat .last-deployed 2>/dev/null || true)
            if [ -n "$BASE" ] && git merge-base --is-ancestor "$BASE" HEAD 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BASE" HEAD || true)
            else
              CHANGED=$(printf 'backend/\nfrontend/\nassistant/\ndeploy/\n')
            fi
            echo "deploy base: ${BASE:-none}"
            echo "changed files:"; echo "$CHANGED"
            cd deploy
            # 按需重建:只构建代码变过的服务,没改就不构建(省流量/省时间)
            SVC=""
            # deploy/ 下是 Dockerfile/compose/启动脚本,影响全部服务 → 全量重建
            echo "$CHANGED" | grep -Eq '^(backend|deploy)/' && SVC="$SVC backend worker" || true
            echo "$CHANGED" | grep -Eq '^(frontend|deploy)/' && SVC="$SVC frontend" || true
            echo "$CHANGED" | grep -Eq '^(assistant|deploy)/' && SVC="$SVC assistant" || true
            COMPOSE="docker compose"; docker compose version >/dev/null 2>&1 || COMPOSE="docker-compose"
            if [ -n "${SVC// }" ]; then
              echo "rebuilding:$SVC"
              $COMPOSE -f docker-compose.yml -f docker-compose.prod.yml up -d --build $SVC
            else
              echo "无应用代码变更,仅确保容器在线"
              $COMPOSE -f docker-compose.yml -f docker-compose.prod.yml up -d
            fi
            sleep 5
            curl -fsS --retry 6 --retry-delay 5 http://127.0.0.1/api/healthz
            # healthz 通过才算部署成功,此刻才推进基线;
            # 失败/超时不写,下次按旧基线重算,漏构建的改动会被重新检出
            git rev-parse HEAD > /opt/hronfire/.last-deployed
